name: CI

# develop/main으로 가는 PR과 머지 결과를 검증한다.
# 목적은 "부팅되지 않는 코드가 develop에 머지되는 것"을 막는 것이다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    # Testcontainers가 실제 PostgreSQL 컨테이너를 띄운다.
    # ubuntu-latest 러너에는 Docker가 기본 설치되어 있어 별도 설정이 필요 없다.
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 17 설정
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 및 테스트
        working-directory: backend
        run: ./gradlew build --no-daemon

      # 실패했을 때 어떤 테스트가 왜 깨졌는지 바로 볼 수 있도록 리포트를 남긴다.
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7
