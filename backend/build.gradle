plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.memorin'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

springBoot {
	buildInfo()
}

repositories {
	mavenCentral()
}

dependencies {

	// DB
	runtimeOnly 'com.h2database:h2'          // 로컬 개발용 인메모리 DB
	runtimeOnly 'org.postgresql:postgresql'  // Docker/운영 환경 PostgreSQL

	// Flyway (DB 스키마 마이그레이션)
	// flyway-database-postgresql: Flyway 10+ 부터 DB별 지원이 분리되어 Postgres는 별도 모듈 필요
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// 테스트용 실제 PostgreSQL 컨테이너
	// jsonb 컬럼과 Postgres 전용 네이티브 쿼리(행 비교 커서 페이징)를 쓰므로 H2로는 검증할 수 없다.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'

	// Web
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// API 문서 (Swagger UI + OpenAPI 3)
	// 컨트롤러가 늘어날 때마다 명세가 자동 축적되도록 미리 붙여둔다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'

	// STOMP @MessageMapping에서 @AuthenticationPrincipal을 해석하려면 필요 (없으면 인자 리졸버가 없어
	// 페이로드 바인딩으로 fallback되면서 principal이 아니라 빈 객체가 주입된다)
	implementation 'org.springframework.security:spring-security-messaging'

	// JWT (develop 확정 버전 0.12.7로 통일)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

	implementation 'io.minio:minio:8.5.17'

	// WebSocket (STOMP) — spring-messaging는 websocket starter가 전이 포함
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// JSONB (Hibernate 6.6 대응: hibernate-types-60 → hypersistence-utils)
	implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.9.11'

	// UUID v7 생성기 (Java 기본 java.util.UUID는 v4까지만 지원 → 시간순 정렬되는 v7 발급용)
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

    implementation 'com.google.firebase:firebase-admin:9.4.3'
    implementation 'nl.martijndwars:web-push:5.1.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}

tasks.named('test') {
	useJUnitPlatform {
		// 스트레스 테스트는 하트비트 주기만큼 기다리는 구간이 있어 CI에서는 제외한다. → stressTest
		excludeTags 'stress'
	}
}

// WebSocket 생명주기 스트레스 테스트 (docs/ws-stress-test.md)
// 힙을 작게 고정해야 세션 누수가 늦게 드러나지 않는다.
tasks.register('stressTest', Test) {
	description = 'WebSocket 세션 생명주기·힙 실측 (수동 실행)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'stress'
	}
	maxHeapSize = '512m'
	jvmArgs '-XX:+HeapDumpOnOutOfMemoryError', '-XX:HeapDumpPath=build/stress-heapdump.hprof'
	// 부하 테스트 파라미터를 테스트 JVM으로 넘긴다.
	// Gradle의 -D는 Gradle JVM에만 붙으므로 여기서 명시적으로 전달해야 한다.
	//   ./gradlew stressTest -Dstress.hikari.pool=20 -Dstress.senders=30
	['stress.hikari.pool', 'stress.senders', 'stress.messages'].each { key ->
		if (System.getProperty(key) != null) {
			systemProperty key, System.getProperty(key)
		}
	}
	testLogging {
		showStandardStreams = true
		events 'passed', 'failed'
	}
	shouldRunAfter tasks.named('test')
}
