spring.application.name=memorin

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
minio.region=${MINIO_REGION:us-east-1}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:memorin-media}
minio.presigned-upload-expiry-seconds=${MINIO_PRESIGNED_UPLOAD_EXPIRY_SECONDS:600}
minio.presigned-download-expiry-seconds=${MINIO_PRESIGNED_DOWNLOAD_EXPIRY_SECONDS:300}
minio.max-upload-size-bytes=${MINIO_MAX_UPLOAD_SIZE_BYTES:52428800}
minio.allowed-content-types=image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime

storage.quota.default-limit-bytes=${STORAGE_QUOTA_DEFAULT_LIMIT_BYTES:1073741824}
storage.quota.pending-ttl-seconds=${STORAGE_QUOTA_PENDING_TTL_SECONDS:900}

# ── 클라이언트 업로드 전 압축 가이드 파라미터 ─────────────────────
# 서버는 presigned PUT으로 업로드되는 파일 바이트를 직접 만지지 않는다.
# 아래 값은 앱/웹 클라이언트가 업로드 전 이미지를 압축할 때 참고하는 가이드일 뿐, 서버가 강제하지 않는다.
media.compression.image-quality-percent=${MEDIA_COMPRESSION_IMAGE_QUALITY_PERCENT:80}
media.compression.image-max-width-px=${MEDIA_COMPRESSION_IMAGE_MAX_WIDTH_PX:1920}
media.compression.image-max-height-px=${MEDIA_COMPRESSION_IMAGE_MAX_HEIGHT_PX:1920}

jwt.secret=${JWT_SECRET}
jwt.access-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
jwt.refresh-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ── CORS 허용 오리진 (로컬 개발 / dev) ─────────────────────────
# 프론트 로컬 개발 서버 오리진(콤마 구분). 앱/웹 도메인이 늘면 여기에 추가.
#   3000=CRA/Next.js, 5173=Vite, 8081=Expo Web
# 주의: 네이티브 앱(RN/Expo)은 CORS 대상이 아니라 이 목록과 무관하다.
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081
