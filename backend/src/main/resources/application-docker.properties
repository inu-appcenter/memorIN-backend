# Docker Compose 환경 설정 (SPRING_PROFILES_ACTIVE=docker 일 때 활성화)

# 푸시 서비스 자격 증명은 Docker Compose 또는 배포 환경변수로 주입한다.
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
web-push.enabled=${WEB_PUSH_ENABLED:false}
web-push.vapid.public-key=${WEB_PUSH_VAPID_PUBLIC_KEY:}
web-push.vapid.private-key=${WEB_PUSH_VAPID_PRIVATE_KEY:}
web-push.vapid.subject=${WEB_PUSH_VAPID_SUBJECT:mailto:admin@memorin.local}

# ─── DataSource ────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP (DB 커넥션 풀) ────────────────────────────────────
# 스프링 부트 기본 커넥션 풀. 기본값에 맡기지 않고 운영 기준을 명시한다.
# PostgreSQL 18 기본 max_connections=100 → 인스턴스당 풀 10개는 여유 있음.
spring.datasource.hikari.pool-name=memorin-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# maximum-pool-size : 풀이 유지할 최대 커넥션 수
# minimum-idle      : 항상 대기시킬 최소 커넥션(=max로 두면 고정 크기 풀 → 성능 일정, Hikari 권장)
# connection-timeout: 커넥션을 못 얻으면 30초 후 예외 발생
# max-lifetime      : 커넥션 최대 수명 30분(DB/인프라 타임아웃보다 짧게 두는 것이 원칙)
# keepalive-time    : 5분마다 유휴 커넥션 생존 확인(끊긴 커넥션 조기 감지)

# ─── JPA / Hibernate ───────────────────────────────────────────
# 스키마 생성/변경은 Flyway가 전담한다. Hibernate는 엔티티가 실제 스키마와
# 어긋나지 않는지 기동 시점에 검증만 한다(validate). 스키마를 직접 만들게 하려면
# 절대 create/update로 바꾸지 말고 db/migration에 새 버전 마이그레이션을 추가한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway (DB 스키마 마이그레이션) ─────────────────────────────
# 기본값(application.properties)은 flyway.enabled=false — 로컬 H2 bootRun은 마이그레이션이
# Postgres 전용 문법(uuidv7(), 네이티브 ENUM 등)이라 애초에 실행 대상이 아니다. docker 프로파일은
# 실제 Postgres를 쓰므로 여기서 다시 켠다.
spring.flyway.enabled=true
# 신규 DB: 빈 스키마에 V1부터 순서대로 전부 적용.
# 기존 DB(이미 01_init.sql로 초기화된 볼륨): baseline-on-migrate로 V1 시점 스키마가
# 이미 적용된 것으로 간주하고, 그 이후 버전(V2~)부터만 적용한다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=init

# ─── MinIO ─────────────────────────────────────────────────────
# endpoint: backend 컨테이너가 MinIO에 접근할 내부 주소
# public-endpoint: 클라이언트가 presigned URL로 직접 업로드할 때 접근할 주소
minio.endpoint=${MINIO_ENDPOINT}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
minio.region=${MINIO_REGION:us-east-1}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME:memorin-media}
minio.presigned-upload-expiry-seconds=${MINIO_PRESIGNED_UPLOAD_EXPIRY_SECONDS:600}
minio.presigned-download-expiry-seconds=${MINIO_PRESIGNED_DOWNLOAD_EXPIRY_SECONDS:300}
minio.max-upload-size-bytes=${MINIO_MAX_UPLOAD_SIZE_BYTES:52428800}
minio.allowed-content-types=${MINIO_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime}

# ─── Storage Quota ─────────────────────────────────────────────
storage.quota.default-limit-bytes=${STORAGE_QUOTA_DEFAULT_LIMIT_BYTES:1073741824}
storage.quota.pending-ttl-seconds=${STORAGE_QUOTA_PENDING_TTL_SECONDS:900}
storage.quota.warning-threshold-percent=${STORAGE_QUOTA_WARNING_THRESHOLD_PERCENT:80}

# ─── 클라이언트 업로드 전 압축 가이드 파라미터 (서버 강제 아님) ────
media.compression.image-quality-percent=${MEDIA_COMPRESSION_IMAGE_QUALITY_PERCENT:80}
media.compression.image-max-width-px=${MEDIA_COMPRESSION_IMAGE_MAX_WIDTH_PX:1920}
media.compression.image-max-height-px=${MEDIA_COMPRESSION_IMAGE_MAX_HEIGHT_PX:1920}

# ─── CORS 허용 오리진 (운영·배포 / prod) ───────────────────────
# 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 오리진을 주입(콤마 구분).
# 관리자 페이지/앱 웹 등 도메인이 늘면 여기에 추가. 예:
#   CORS_ALLOWED_ORIGINS=https://memorin.inuappcenter.co.kr,https://admin.memorin.inuappcenter.co.kr
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://memorin.inuappcenter.co.kr}
