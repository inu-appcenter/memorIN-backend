# Docker Compose 환경 설정 (SPRING_PROFILES_ACTIVE=docker 일 때 활성화)

# ─── DataSource ────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───────────────────────────────────────────
# none: 스키마 검증 안 함 (Sprint 0 — 엔티티 정렬 전)
# 건희님이 도메인 엔티티 세팅 완료 후 validate로 변경 예정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── MinIO ─────────────────────────────────────────────────────
# endpoint: backend 컨테이너가 MinIO에 접근할 내부 주소
# public-endpoint: 클라이언트가 presigned URL로 직접 업로드할 때 접근할 주소
minio.endpoint=${MINIO_ENDPOINT}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
minio.region=${MINIO_REGION:us-east-1}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME:memorin-media}
minio.presigned-upload-expiry-seconds=${MINIO_PRESIGNED_UPLOAD_EXPIRY_SECONDS:600}
minio.presigned-download-expiry-seconds=${MINIO_PRESIGNED_DOWNLOAD_EXPIRY_SECONDS:300}
minio.max-upload-size-bytes=${MINIO_MAX_UPLOAD_SIZE_BYTES:52428800}
minio.allowed-content-types=${MINIO_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime}

# ─── Storage Quota ─────────────────────────────────────────────
storage.quota.default-limit-bytes=${STORAGE_QUOTA_DEFAULT_LIMIT_BYTES:1073741824}
storage.quota.max-single-upload-bytes=${STORAGE_QUOTA_MAX_SINGLE_UPLOAD_BYTES:52428800}
storage.quota.pending-ttl-seconds=${STORAGE_QUOTA_PENDING_TTL_SECONDS:900}
