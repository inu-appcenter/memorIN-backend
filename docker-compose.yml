# 모든 서비스 공통 로그 로테이션(#230). 드라이버가 로그를 무한히 쌓으면 디스크가 찬다.
# max-size 10m × max-file 3 = 서비스당 최대 30MB로 상한.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine # alpine 80mb 초경량 리눅스 버전
    container_name: memorin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memorin_db}
      POSTGRES_USER: ${POSTGRES_USER:-memorin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorin_pass}
    ports:
      # DB 포트는 backend와 로컬 개발툴(DBeaver 등, docs/pgadmin-onboarding-grant-guide.md)만 쓴다.
      # 외부에서 직접 붙을 이유가 없어 루프백에만 바인딩한다 — 같은 머신에서는 localhost로 여전히
      # 접속되고(pgAdmin은 컨테이너 네트워크 내부에서 서비스명으로 접속하므로 영향 없음), 호스트
      # 밖에서는 아예 안 보인다(#230).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - memorin_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memorin_user} -d ${POSTGRES_DB:-memorin_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    # 실측 없이 잡은 출발점(#230) — 부족하면 STORAGE_QUOTA 등과 함께 재실측 필요.
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512m}

  minio:
    image: minio/minio:latest
    container_name: memorin_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # 9000(S3 API)은 그대로 공개한다 — 클라이언트(브라우저/앱)가 presigned URL로
      # 이 포트를 직접 때린다(minio.public-endpoint). 여기 막으면 업로드/다운로드가 전부 깨진다.
      - "${MINIO_PORT:-9000}:9000"
      # 9001(관리 콘솔)은 관리자 전용 도구라 postgres와 같은 이유로 루프백만 연다(#230).
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - memorin_network
    # postgresql 완전히 켜지는데 보통 10-30초 걸림. 그래서 5번 재시도 설정
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${MINIO_MEMORY_LIMIT:-512m}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorin_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-memorin_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-memorin_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-memorin_pass}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-memorin-media}
      MINIO_ALLOWED_CONTENT_TYPES: ${MINIO_ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime}
      MINIO_PRESIGNED_UPLOAD_EXPIRY_SECONDS: ${MINIO_PRESIGNED_UPLOAD_EXPIRY_SECONDS:-600}
      MINIO_PRESIGNED_DOWNLOAD_EXPIRY_SECONDS: ${MINIO_PRESIGNED_DOWNLOAD_EXPIRY_SECONDS:-300}
      MINIO_MAX_UPLOAD_SIZE_BYTES: ${MINIO_MAX_UPLOAD_SIZE_BYTES:-52428800}
      # TODO: 건희님 작업 이후 채우기
      # 서비스 배포 시에는 랜덤 256비트 문자열 사용
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      INSTANCE_PUBLIC: ${INSTANCE_PUBLIC:-true}
      INSTANCE_NAME: ${INSTANCE_NAME:-memorIN}
      INSTANCE_DESCRIPTION: ${INSTANCE_DESCRIPTION:-A memorIN instance}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      STORAGE_QUOTA_DEFAULT_LIMIT_BYTES: ${STORAGE_QUOTA_DEFAULT_LIMIT_BYTES:-1073741824}
      STORAGE_QUOTA_PENDING_TTL_SECONDS: ${STORAGE_QUOTA_PENDING_TTL_SECONDS:-900}
      STORAGE_QUOTA_WARNING_THRESHOLD_PERCENT: ${STORAGE_QUOTA_WARNING_THRESHOLD_PERCENT:-80}
      MEDIA_COMPRESSION_IMAGE_QUALITY_PERCENT: ${MEDIA_COMPRESSION_IMAGE_QUALITY_PERCENT:-80}
      MEDIA_COMPRESSION_IMAGE_MAX_WIDTH_PX: ${MEDIA_COMPRESSION_IMAGE_MAX_WIDTH_PX:-1920}
      MEDIA_COMPRESSION_IMAGE_MAX_HEIGHT_PX: ${MEDIA_COMPRESSION_IMAGE_MAX_HEIGHT_PX:-1920}
      # 기본값을 특정 조직 도메인으로 두지 않는다(#229, JWT_SECRET과 동일 패턴).
      # .env에 없으면 docker-compose가 빈 문자열로 채우고, 그 결과 CORS가 전부 막힌다 —
      # 값을 빼먹었을 때 남의 도메인을 조용히 물려받는 대신 눈에 띄게 실패하는 쪽을 택했다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Swagger/OpenAPI 문서. 기본 꺼짐 — 셀프호스팅 배포에서 전체 API 명세가 인증 없이
      # 노출되는 걸 막는다(#261). 필요하면 true로 켠다.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # 푸시 알림. 기본은 둘 다 꺼짐 — 켜지 않으면 알림은 DB에 저장만 되고 발송되지 않는다.
      # 서비스 계정 JSON은 이미지에 굽지 않고 secrets/ 볼륨으로 주입한다(아래 volumes).
      # FileInputStream으로 읽으므로 클래스패스 리소스가 아니라 실제 파일 경로여야 한다.
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/run/secrets/firebase-service-account.json}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:admin@memorin.local}
      # 힙 상한은 컨테이너 메모리의 75%. 고정값(-Xmx)보다 이식성이 좋다.
      # 힙덤프는 /dump 볼륨에 남긴다 — 컨테이너 안에 떨구면 죽는 순간 같이 사라져서 원인을 못 본다.
      # OOM이면 반쯤 죽은 채 버티지 말고 즉시 종료 → restart 정책이 다시 띄운다.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/dump/heapdump.hprof
        -XX:+ExitOnOutOfMemoryError
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - heapdumps:/dump
      # 시크릿 파일 주입. 파일이 아니라 디렉터리를 마운트하는 이유는, 파일을 직접 바인드하면
      # 호스트에 그 파일이 없을 때 Docker가 같은 이름의 "빈 디렉터리"를 만들어 버리기 때문이다.
      # secrets/ 는 .gitkeep으로 저장소에 존재하고, 안의 내용물은 .gitignore가 막는다.
      - ./secrets:/run/secrets:ro
    # 상한이 없으면 JVM은 호스트 메모리 기준으로 힙을 잡는다(노트북 16GB ↔ 서버 2GB).
    # 반대로 상한만 걸고 힙을 안 잡으면 OOMKilled(137)로 로그 없이 죽는다. 둘은 항상 같이 간다.
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-1g}
    # postgres, minio 전부 켜져야 backend 실행됨.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - memorin_network
    # HTTP 계층은 응답하는데 DB 커넥션 풀만 죽은 "반쯤 죽은" 상태를 잡기 위한 헬스체크(#230).
    # /api/health는 인증 없이 열려 있고 DB 연결까지 확인한다(HealthController).
    # start_period 30초: Flyway 마이그레이션 + JPA 스키마 검증 포함 기동 시간(로컬 실측 ~3초)에
    # 여유를 크게 둔다 — 이 구간의 실패는 unhealthy로 집계되지 않는다.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: memorin_pgadmin
    restart: unless-stopped
    profiles: ["tools"]   # docker compose --profile tools up 으로 선택적 실행
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@memorin.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - memorin_network
    logging: *default-logging


# 컨테이너 삭제되더라도 postgres, minio 데이터 남아있음.
# docker compose down -v 하면 데이터도 삭제됨.
volumes:
  postgres_data:
  minio_data:
  heapdumps:

networks:
  memorin_network:
    driver: bridge
